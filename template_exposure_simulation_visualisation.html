<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{STOCK_TICKER}} NYMO Exposure Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.3em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .meta {
            text-align: center;
            margin-bottom: 20px;
            opacity: 0.85;
        }
        .controls {
            background: rgba(255, 255, 255, 0.1);
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 36px;
            align-items: center;
        }
        .controls label {
            font-size: 1em;
            cursor: pointer;
            user-select: none;
        }
        .controls input[type="range"] {
            width: 220px;
            vertical-align: middle;
            margin-left: 10px;
        }
        .controls input[type="checkbox"] {
            transform: scale(1.2);
            margin-right: 8px;
            vertical-align: middle;
        }
        .strategy-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        @media (max-width: 900px) {
            .strategy-grid { grid-template-columns: 1fr; }
        }
        .strategy-card {
            background: rgba(255, 255, 255, 0.12);
            padding: 18px;
            border-radius: 10px;
            border-left: 4px solid var(--accent, #fff);
        }
        .strategy-card h3 {
            margin: 0 0 12px 0;
            font-size: 1.1em;
        }
        .strategy-card .row {
            display: flex;
            justify-content: space-between;
            margin: 4px 0;
            font-size: 0.95em;
        }
        .strategy-card .row .label { opacity: 0.75; }
        .strategy-card .row .value { font-weight: bold; }
        .positive { color: #4ade80; }
        .negative { color: #f87171; }
        .chart-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            height: 420px;
        }
        .chart-container.short {
            height: 220px;
        }
        .blacklist-banner {
            background: rgba(255, 165, 0, 0.18);
            border: 1px solid rgba(255, 165, 0, 0.45);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 16px;
            color: #ffd28a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📈 {{STOCK_TICKER}} — NYMO Exposure Simulation</h1>
        <div class="meta">
            <b>Stock:</b> {{STOCK_TICKER}} &nbsp;|&nbsp; <b>Price:</b> {{STOCK_PRICE_TYPE}} &nbsp;|&nbsp; <b>Window:</b> {{STOCK_MONTHS}} months
            &nbsp;|&nbsp; NYMO scale: −50 → 100% in, 0 → 50%, +50 → 0%
        </div>

        <div id="blacklistBanner"></div>

        <div class="controls">
            <label>
                Rebalance threshold: <span id="thresholdValue">5.0%</span>
                <input type="range" id="thresholdSlider" min="0" max="20" step="0.5" value="5">
            </label>
            <label>
                <input type="checkbox" id="fractionalCheckbox" checked>
                Allow fractional shares
            </label>
        </div>

        <div class="strategy-grid" id="strategyGrid"></div>

        <div class="chart-container">
            <canvas id="portfolioChart"></canvas>
        </div>

        <div class="chart-container short">
            <canvas id="exposureChart"></canvas>
        </div>
    </div>

    <script>
    const csvData = `date,NYMO value,NYSI value,Red / Black,Trade Date,Stock Price ({{STOCK_PRICE_TYPE}}),Blacklisted
// Replaced by exposure_simulator.py`;

    const STARTING_CAPITAL = 10000;
    const HAS_BLACKLIST = {{HAS_BLACKLIST}};
    const BLACKLIST_START = '{{BLACKLIST_START}}';
    const BLACKLIST_END = '{{BLACKLIST_END}}';

    function parseCSV(csv) {
        const lines = csv.trim().split('\n');
        const headers = lines[0].split(',');
        return lines.slice(1).map(line => {
            const values = line.split(',');
            const obj = {};
            headers.forEach((h, i) => {
                obj[h.trim()] = values[i] !== undefined ? values[i].trim() : null;
            });
            return obj;
        });
    }

    // NYMO -> target equity fraction. Clamped to [-50, +50].
    //   -50 -> 1.0 (100%), 0 -> 0.5 (50%), +50 -> 0.0 (0%)
    function nymoToTargetExposure(nymo) {
        const clamped = Math.max(-50, Math.min(50, nymo));
        return (50 - clamped) / 100;
    }

    function adjustShares(currentShares, targetShares, fractional) {
        if (fractional) return targetShares;
        // Whole-share rounding: round toward zero for sells (always achievable),
        // floor for buys (don't overspend).
        if (targetShares > currentShares) return Math.floor(targetShares);
        return Math.ceil(targetShares);
    }

    // --- Strategy: NYMO-scaled exposure ---
    function runExposureModel(data, opts) {
        const thresholdFrac = opts.thresholdPct / 100;
        const fractional = opts.fractional;
        let cash = STARTING_CAPITAL;
        let shares = 0;
        let trades = 0;
        let history = [];

        for (const row of data) {
            const nymo = parseFloat(row['NYMO value']);
            const price = parseFloat(row['Stock Price ({{STOCK_PRICE_TYPE}})']);
            const blacklisted = row['Blacklisted'] === 'True';
            if (!price || isNaN(price) || isNaN(nymo)) continue;

            const equityValue = cash + shares * price;
            let exposure = (shares * price) / equityValue;

            if (!blacklisted) {
                const targetExposure = nymoToTargetExposure(nymo);
                const targetSharesValue = equityValue * targetExposure;
                const currentSharesValue = shares * price;
                const drift = Math.abs(targetSharesValue - currentSharesValue) / equityValue;

                if (drift >= thresholdFrac) {
                    const targetSharesRaw = targetSharesValue / price;
                    const newShares = adjustShares(shares, targetSharesRaw, fractional);
                    const delta = newShares - shares;
                    cash -= delta * price;
                    shares = newShares;
                    trades += 1;
                    exposure = (shares * price) / (cash + shares * price);
                }
            }

            const finalEquity = cash + shares * price;
            history.push({
                date: row.date,
                value: finalEquity,
                nymo,
                exposure,
                targetExposure: nymoToTargetExposure(nymo),
            });
        }

        return { name: 'NYMO Exposure', history, trades, finalValue: history.length ? history[history.length-1].value : STARTING_CAPITAL };
    }

    // --- Strategy: binary NYSI Red/Black (the existing strategy, any-Black when flat) ---
    function runBinaryModel(data, opts) {
        const fractional = opts.fractional;
        let cash = STARTING_CAPITAL;
        let shares = 0;
        let trades = 0;
        let history = [];
        let lastValidPrice = null;

        for (let i = 1; i < data.length; i++) {
            const row = data[i];
            const signal = row['Red / Black'];
            const price = parseFloat(row['Stock Price ({{STOCK_PRICE_TYPE}})']);
            const blacklisted = row['Blacklisted'] === 'True';
            if (!price || isNaN(price)) continue;
            lastValidPrice = price;

            if (!blacklisted) {
                if (signal === 'Black' && shares === 0) {
                    let buyShares = cash / price;
                    if (!fractional) buyShares = Math.floor(buyShares);
                    if (buyShares > 0) {
                        cash -= buyShares * price;
                        shares = buyShares;
                        trades += 1;
                    }
                } else if (signal === 'Red' && shares > 0) {
                    cash += shares * price;
                    shares = 0;
                    trades += 1;
                }
            }

            history.push({ date: row.date, value: cash + shares * price });
        }

        // Mark-to-market close so realised stats include any open position
        if (shares > 0 && lastValidPrice !== null) {
            cash += shares * lastValidPrice;
            shares = 0;
        }

        return { name: 'Binary NYSI', history, trades, finalValue: history.length ? history[history.length-1].value : STARTING_CAPITAL };
    }

    // --- Buy and hold (benchmark) ---
    function runBuyAndHold(data, opts) {
        const fractional = opts.fractional;
        let cash = STARTING_CAPITAL;
        let shares = 0;
        let history = [];
        let bought = false;

        for (const row of data) {
            const price = parseFloat(row['Stock Price ({{STOCK_PRICE_TYPE}})']);
            if (!price || isNaN(price)) continue;
            if (!bought) {
                let buyShares = cash / price;
                if (!fractional) buyShares = Math.floor(buyShares);
                cash -= buyShares * price;
                shares = buyShares;
                bought = true;
            }
            history.push({ date: row.date, value: cash + shares * price });
        }

        return { name: 'Buy & Hold', history, trades: bought ? 1 : 0, finalValue: history.length ? history[history.length-1].value : STARTING_CAPITAL };
    }

    function fmtMoney(v) {
        return '$' + v.toLocaleString(undefined, { maximumFractionDigits: 0 });
    }
    function fmtPct(v) {
        return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
    }

    const STRATEGY_COLOURS = {
        'NYMO Exposure': '#a78bfa',
        'Binary NYSI':   '#fbbf24',
        'Buy & Hold':    '#94a3b8',
    };

    let portfolioChart = null;
    let exposureChart = null;

    function render(strategies, exposureSeries) {
        const grid = document.getElementById('strategyGrid');
        grid.innerHTML = '';
        for (const s of strategies) {
            const ret = ((s.finalValue - STARTING_CAPITAL) / STARTING_CAPITAL) * 100;
            const cls = ret >= 0 ? 'positive' : 'negative';
            const card = document.createElement('div');
            card.className = 'strategy-card';
            card.style.setProperty('--accent', STRATEGY_COLOURS[s.name]);
            card.innerHTML = `
                <h3 style="color:${STRATEGY_COLOURS[s.name]}">${s.name}</h3>
                <div class="row"><span class="label">Final value</span><span class="value">${fmtMoney(s.finalValue)}</span></div>
                <div class="row"><span class="label">Return</span><span class="value ${cls}">${fmtPct(ret)}</span></div>
                <div class="row"><span class="label">Trades</span><span class="value">${s.trades.toLocaleString()}</span></div>
            `;
            grid.appendChild(card);
        }

        // Portfolio value overlay
        const labels = strategies[0].history.map(p => p.date);
        const datasets = strategies.map(s => ({
            label: s.name,
            data: s.history.map(p => p.value),
            borderColor: STRATEGY_COLOURS[s.name],
            backgroundColor: STRATEGY_COLOURS[s.name] + '22',
            borderWidth: 2,
            fill: false,
            tension: 0.1,
            pointRadius: 0,
        }));

        if (portfolioChart) portfolioChart.destroy();
        portfolioChart = new Chart(document.getElementById('portfolioChart').getContext('2d'), {
            type: 'line',
            data: { labels, datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    title: { display: true, text: 'Portfolio Value — Strategy Comparison', color: 'white', font: { size: 15 } },
                    legend: { labels: { color: 'white' } },
                    tooltip: {
                        callbacks: {
                            label: ctx => `${ctx.dataset.label}: ${fmtMoney(ctx.parsed.y)}`,
                        },
                    },
                },
                scales: {
                    x: { display: false, ticks: { color: 'white' } },
                    y: {
                        grid: { color: 'rgba(255,255,255,0.1)' },
                        ticks: { color: 'white', callback: v => '$' + v.toLocaleString() },
                    },
                },
            },
        });

        // Exposure / NYMO trace
        if (exposureChart) exposureChart.destroy();
        exposureChart = new Chart(document.getElementById('exposureChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: exposureSeries.map(p => p.date),
                datasets: [
                    {
                        label: 'NYMO',
                        data: exposureSeries.map(p => p.nymo),
                        borderColor: '#60a5fa',
                        borderWidth: 1.5,
                        pointRadius: 0,
                        yAxisID: 'yNymo',
                        tension: 0.1,
                    },
                    {
                        label: 'Target exposure %',
                        data: exposureSeries.map(p => p.targetExposure * 100),
                        borderColor: '#a78bfa',
                        borderWidth: 1.5,
                        borderDash: [4, 3],
                        pointRadius: 0,
                        yAxisID: 'yExp',
                        tension: 0.1,
                    },
                    {
                        label: 'Actual exposure %',
                        data: exposureSeries.map(p => p.exposure * 100),
                        borderColor: '#22c55e',
                        borderWidth: 1.5,
                        pointRadius: 0,
                        yAxisID: 'yExp',
                        tension: 0.1,
                    },
                ],
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    title: { display: true, text: 'NYMO vs Target/Actual Exposure', color: 'white', font: { size: 13 } },
                    legend: { labels: { color: 'white', boxWidth: 12, font: { size: 11 } } },
                },
                scales: {
                    x: { display: false, ticks: { color: 'white' } },
                    yNymo: {
                        position: 'left',
                        title: { display: true, text: 'NYMO', color: '#60a5fa' },
                        grid: { color: 'rgba(255,255,255,0.08)' },
                        ticks: { color: '#60a5fa' },
                    },
                    yExp: {
                        position: 'right',
                        min: 0, max: 100,
                        title: { display: true, text: 'Exposure %', color: '#a78bfa' },
                        grid: { drawOnChartArea: false },
                        ticks: { color: '#a78bfa', callback: v => v + '%' },
                    },
                },
            },
        });
    }

    function run() {
        const thresholdPct = parseFloat(document.getElementById('thresholdSlider').value);
        const fractional = document.getElementById('fractionalCheckbox').checked;
        document.getElementById('thresholdValue').textContent = thresholdPct.toFixed(1) + '%';

        const data = parseCSV(csvData);
        const exposure = runExposureModel(data, { thresholdPct, fractional });
        const binary = runBinaryModel(data, { fractional });
        const buyHold = runBuyAndHold(data, { fractional });

        render([exposure, binary, buyHold], exposure.history);
    }

    // Blacklist banner
    if (HAS_BLACKLIST) {
        document.getElementById('blacklistBanner').innerHTML =
            `🚫 Blacklist period (no trades): <b>${BLACKLIST_START}</b> to <b>${BLACKLIST_END}</b>`;
        document.getElementById('blacklistBanner').className = 'blacklist-banner';
    }

    // Initial render + bind controls
    run();
    document.getElementById('thresholdSlider').addEventListener('input', run);
    document.getElementById('fractionalCheckbox').addEventListener('change', run);
    </script>
</body>
</html>
